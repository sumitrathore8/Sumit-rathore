<!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
    <link rel="stylesheet" href="flipkart.css">
    <style>
        .product-view { display: flex; background: white; padding: 20px; margin-top: 20px; gap: 40px; }
        .img-side { flex: 1; text-align: center; }
        .info-side { flex: 2; }
        .price-tag { font-size: 28px; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>
    <header>
        <div class="nav-content">
            <div class="logo"><a href="index.html">Flipkart</a></div>
            <nav><a href="index.html">Home</a><a href="cart.html">Cart</a></nav>
        </div>
    </header>

    <div class="container product-view">
        <div class="img-side">
            <img src="https://via.placeholder.com/300x400" alt="Main Product">
            <div style="margin-top:20px;">
                <button class="btn-yellow" onclick="location.href='cart.html'">ADD TO CART</button>
                <button class="btn-orange">BUY NOW</button>
            </div>
        </div>
        <div class="info-side">
            <h2>APPLE iPhone 14 (Blue, 128 GB)</h2>
            <p style="color: #388e3c; font-weight: bold;">Special Price</p>
            <div class="price-tag">₹69,999</div>
            <h4>Available Offers</h4>
            <ul>
                <li>Bank Offer 5% Cashback on Flipkart Axis Bank Card</li>
                <li>Partner Offer Sign up for Flipkart Pay Later</li>
            </ul>
        </div>
    </div>
</body>
</html>
