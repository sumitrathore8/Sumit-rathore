<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display property</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .header{
            width: 100%;
            height: 100%;
            margin: 5px;
            background-color: rgb(0, 0, 0);
        }
        div h1{
            color: white;
            text-align: center;
            padding: 10px;
            line-height: 40px;
        } 
        .main{
            width: 50%;
            height: 50%;
            background-color:pink;
            padding: 10px;
            margin: 20px;
        }  
        div img{
            height: 50%;
            width: 50%;
        }
        .main h2{
            color: black;
            font: 100px;
        }
        button{
            background-color: aqua;
        }
        #ab{
            background-color: red;
        }
        span{
            color: green;
        }
         
     </style>
</head>
<body>
    <div class="header"> ›
        <h1>HighFashion</h1>
    </div>
    <center>
    <div class="main">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-Fg356zSL73-OUTeQ4xAfLN_6Cn9f2ZhY2Q&s" alt="shopping image" width="100px" height="100px">
        <h2>Cotton Jersey of Rohit </h2>
        <p>Jersey is signed by the <b>Hitman</b> </p>
        <span>₹5000 </span><br>
        <p><b>Size:</b></p>
        <button>30</button> <button>32</button> <button>34</button> <button>36</button><br>
        <input type="button" value="add to cart"><br>
        <button id="ab">buy now</button>

    </div>
    </center>
</body>
</html>
